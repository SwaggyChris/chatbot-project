use_default_settings: true

general:
  debug: false
  instance_name: "SWAGGBOT Local Search"

search:
  safe_search: 1
  autocomplete: ""
  formats:
    - html
    - json

server:
  secret_key: "swaggbot-local-secret-change-this-before-sharing"
  bind_address: "0.0.0.0"
  port: 8080
  limiter: false
  image_proxy: false
